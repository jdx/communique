name: mise-lock

# Regenerates mise.lock on Renovate branches. Renovate's mise manager bumps the
# tool version but leaves the per-platform URLs and checksums behind, so the
# lockfile ends up labelled with the new version while still pointing at the old
# release — `hk = "latest"` read 2.0.1 in #341/#342 while every platform block
# still downloaded v1.58.1, so CI silently kept running the old hk. The hosted
# Mend app this org uses does not run postUpgradeTasks, so the regeneration has
# to happen here rather than in Renovate's own config. See jdx/renovate-config
# for the workflow implementation.

on:
  push:
    branches: ["renovate/**"]

permissions: {}

jobs:
  mise-lock:
    permissions:
      # Pushes the regenerated lockfile back onto the Renovate branch. The
      # shared workflow gates itself on the sender being renovate[bot], so our
      # own fix-up push cannot re-enter it.
      contents: write # commit mise.lock and the regenerated render output
    uses: jdx/renovate-config/.github/workflows/mise-lock.yml@aa49efc3545650fa660ac796e7f856dbee0681ee # main
    with:
      # ci-impl runs `mise run render` and fails the branch if it produces a
      # diff, and render generates the CLI reference with the mise-managed
      # usage. A usage bump therefore has to regenerate these in the same
      # commit, otherwise the lockfile fix just trades one red check for
      # another.
      post_update_task: render
      # render's tracked outputs.
      post_update_paths: |
        communique.usage.kdl
        docs/cli
    secrets:
      MISE_LOCK_APP_ID: ${{ secrets.MISE_LOCK_APP_ID }}
      MISE_LOCK_APP_PRIVATE_KEY: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
