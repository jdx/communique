[env]
_.path = "target/debug"

[tasks.build]
run = "cargo build"

[tasks.render]
depends = ["build", "build-usage"]
run = [
  "communique usage > communique.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  "target/usage-cli/bin/usage g markdown -mf communique.usage.kdl --out-dir docs/cli --url-prefix /cli",
  "target/usage-cli/bin/usage g json -f communique.usage.kdl > docs/cli/commands.json",
  "git add communique.usage.kdl docs/cli",
]

[tasks.build-usage]
run = "cargo install --locked --git https://github.com/jdx/usage --rev 92a1911779ab81edc4b1f64eb7b32715f93b0331 --root target/usage-cli usage-cli"
sources = ["Cargo.lock"]
outputs = ["target/usage-cli/bin/usage"]

[tasks.lint]
run = "hk check --all"

[tasks.lint-fix]
run = "hk fix --all"

[tasks.docs]
dir = "docs"
run = "npm i && exec npm run docs:dev"

# rust is managed by rustup, not mise
[tools]
hk = "latest"
pkl = "latest"
ripgrep = "latest"
