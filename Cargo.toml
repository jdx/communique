[package]
name = "communique"
version = "1.3.5"
edition = "2024"
resolver = "3"
description = "Editorialized release notes powered by AI"
repository = "https://github.com/jdx/communique"
license = "MIT"

[dependencies]
usage-rs = { version = "6", features = ["diagnostics", "completions"] }
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
regex = "1"
log = "0.4"
clx = { version = "3", features = ["log"] }
console = "0.16"
toml = "1"
xx = "2"
strum = { version = "0.28", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.dev]
debug = 1
